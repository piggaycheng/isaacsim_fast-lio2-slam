# Nav2 Humble collision_monitor: last sensor-based gate between Nav2 and cmd_vel_safety.
# Points/radius are derived from the padded robot footprint by global_fusion.launch.py.
# Both sources use footprint-based self filtering and retain nearby external returns.
collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /nav2/cmd_vel
    cmd_vel_out_topic: /nav2/cmd_vel_monitored
    transform_tolerance: 0.5
    # Humble ignores stale sources; cmd_vel_safety stops when neither source is fresh.
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["PolygonSurroundForward", "PolygonSurroundReverse", "PolygonRotate", "PolygonSlow", "FootprintApproach"]
    # Stop/slowdown trigger when more than max_points points are inside the zone.
    PolygonSurroundForward:
      type: polygon
      action_type: stop
      max_points: 3
      visualize: true
      polygon_pub_topic: /collision_monitor/polygon_surround_forward
      enabled: true
    PolygonSurroundReverse:
      type: polygon
      action_type: stop
      max_points: 3
      visualize: true
      polygon_pub_topic: /collision_monitor/polygon_surround_reverse
      enabled: true
    PolygonRotate:
      type: circle
      action_type: stop
      max_points: 3
      visualize: true
      polygon_pub_topic: /collision_monitor/polygon_rotate
      enabled: true
    PolygonSlow:
      type: polygon
      action_type: slowdown
      max_points: 3
      slowdown_ratio: 0.5
      visualize: true
      polygon_pub_topic: /collision_monitor/polygon_slowdown
      enabled: true
    # Direction-aware: simulates the local costmap footprint along the command and
    # scales speed by time-to-collision / time_before_collision.
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.5
      simulation_time_step: 0.1
      max_points: 3
      visualize: false
      enabled: true
    observation_sources: ["obstacles", "scan"]
    # Ground-filtered 3D points in base_link; withheld when no ground plane is found.
    obstacles:
      type: pointcloud
      topic: /perception/obstacles
      min_height: 0.06
      max_height: 2.0
      enabled: true
    # 2D slice without ground filtering; keeps the gate alive if obstacles is withheld.
    scan:
      type: scan
      topic: /scan
      enabled: true

cmd_vel_safety:
  ros__parameters:
    # Keep aligned with collision_monitor.source_timeout.
    sensor_timeout: 1.0
    # Acceleration only: safety braking and zero commands bypass these limits.
    # Keep aligned with velocity_smoother.max_accel in navigation.yaml.
    max_linear_accel: 0.8
    max_angular_accel: 1.5
    # Speed caps (robot limits); navigation.yaml's velocity_smoother stays within them.
    max_linear_speed: 0.75
    max_angular_speed: 0.5
    command_timeout: 0.5
