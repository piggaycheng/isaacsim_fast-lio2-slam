# Robot-type profile: Nova Carter.
#
# Shared by Isaac Sim (standalone.py) and the ROS launch files, and the template
# for a new robot type (copy to config/robots/<type>.yaml and replace every value;
# see docs/multi_robot.md). parameter_overrides lists every vehicle-specific value:
# - Drive train, IMU and PCD covariance exist only here; the base files
#   (local_odometry.yaml, global_fusion.yaml) omit them and launch fails if a
#   profile lacks one (robot_fleet.REQUIRED_OVERRIDES).
# - Footprint, safety zones and speeds also keep Nova Carter's values as the
#   base-config defaults; test_robot_namespace keeps those copies equal.

simulation:
  # Isaac asset path relative to the assets root.
  asset: /Isaac/Robots/NVIDIA/NovaCarter/nova_carter.usd
  # Prim paths relative to the robot prim.
  articulation: chassis_link
  lidar: chassis_link/sensors/XT_32/PandarXT_32_10hz
  imu: chassis_link/sensors/XT_32/PandarXT_32_10hz/fastlio_imu
  wheel_joints: [joint_wheel_left, joint_wheel_right]
  wheel_radius: 0.14
  wheel_base: 0.4132
  # Drive wheels lead, caster wheels trail: USD +x is base_link +x.
  forward_sign: 1.0
  spawn_height: 0.05
  # Pan/tilt gimbal with a camera (revolute joints, no visual geometry), optional.
  # translation: pan/tilt axis origin relative to chassis_link (m); the camera sits 3 cm
  # ahead of it. Pan is unlimited; speeds in deg/s, limits in deg.
  gimbal: {translation: [0.0, 0.0, 0.52], max_speed_deg_s: 90.0, tilt_limits_deg: [-90.0, 90.0]}

# base_link -> sensor frames published by static_transform_publisher (m, rad).
# imu_link is the FAST-LIO body: its inverse is the body -> base_link transform used by
# localization_3d_pose / global_pose_adapter (imu_mount) and covariance_calibration.py.
sensor_frames:
  lidar_link: {x: -0.213, y: 0.009, z: 0.526, roll: 0.0, pitch: 0.0, yaw: 0.0}
  imu_link: {x: -0.213, y: 0.009, z: 0.526, roll: 0.0, pitch: 0.0, yaw: 0.0}

# local_ekf (odom -> base_link) inputs, any of wheel, imu, lio
# (slam_nav/config/local_ekf_inputs.yaml). Launch argument local_odometry_inputs
# overrides it. Without wheel the wheel_encoder_odometry parameters are optional
# and the global EKF propagates with /lio/twist (variances in global_fusion.yaml);
# lio requires the lio_odometry variances below.
local_odometry:
  inputs: [wheel, imu]

# Deep-merged into every parameter file that contains the node key; lists are
# replaced, not merged. Values not listed here come from the shared base configs.
parameter_overrides:
  # --- Drive train and covariance (slam_nav/config/local_odometry.yaml) ---
  wheel_encoder_odometry:
    ros__parameters:
      left_joint: joint_wheel_left
      right_joint: joint_wheel_right
      wheel_radius: 0.14
      wheel_base: 0.4132
      encoder_ticks_per_revolution: 2048
      # Simulated encoder calibration error and direction.
      left_distance_scale: 1.002
      right_distance_scale: 0.998
      left_direction: 1.0
      right_direction: 1.0
      distance_noise_ratio: 0.005
      # Written by covariance_calibration.py --apply.
      distance_variance_per_meter: 7.47497e-05
      position_variance_per_radian: 4.3215e-05
      yaw_variance_per_meter: 0.00119611
      yaw_variance_per_radian: 9.06684e-05
  nav_imu_adapter:
    ros__parameters:
      orientation_variance: 0.01
      angular_velocity_variance: 0.000826544
      linear_acceleration_variance: 0.04
  # Per-scan FAST-LIO pose noise for local_ekf (only used with the lio input;
  # the global EKF's /lio/twist variances live in config/global_fusion.yaml).
  lio_odometry:
    ros__parameters:
      # Written by covariance_calibration.py --apply.
      position_variance: 8.37166e-07
      yaw_variance: 1.19203e-07
  # --- PCD localization covariance (config/global_fusion.yaml) ---
  global_pose_adapter:
    ros__parameters:
      registration_covariance_scale: 1.0
      min_covariance_xy: 0.000147573
      min_covariance_yaw: 1.4647e-06

  # --- Footprint in base_link (measure with scripts/usd_bbox.py) ---
  # config/observation_costmaps.yaml. The global costmap plans with the in-place
  # rotation circle; robot_radius must cover the padded footprint's rotation sweep
  # (0.738 m) plus one cell after Nav2's 16-gon (robot_fleet.rotation_radius).
  global_costmap:
    global_costmap:
      ros__parameters:
        footprint: '[]'
        robot_radius: 0.81
        footprint_padding: 0.0
        inflation_layer: {inflation_radius: 1.1}
  local_costmap:
    local_costmap:
      ros__parameters:
        footprint: '[[0.20, 0.32], [0.20, -0.32], [-0.65, -0.32], [-0.65, 0.32]]'
        footprint_padding: 0.01
        inflation_layer: {inflation_radius: 0.9}
  # slam_nav/config/ground_obstacle_filter.yaml: [x_min, x_max, y_min, y_max]
  ground_obstacle_filter:
    ros__parameters:
      ground_z: 0.0
      self_filter_bounds: [-0.65, 0.20, -0.32, 0.32]

  # --- Safety zones, x/y pairs in base_link (config/collision_monitor.yaml) ---
  collision_monitor:
    ros__parameters:
      PolygonStop: {points: [0.85, 0.36, 0.85, -0.36, 0.20, -0.36, 0.20, 0.36]}
      # Rear margin includes the measured 1 m/s reverse stopping distance.
      PolygonSurround: {points: [0.80, 0.75, 0.80, -0.75, -1.35, -0.75, -1.35, 0.75]}
      PolygonSlow: {points: [0.95, 0.50, 0.95, -0.50, 0.20, -0.50, 0.20, 0.50]}
  # config/adaptive_surround.yaml
  adaptive_surround:
    ros__parameters:
      crawl_points: [0.45, 0.55, 0.45, -0.55, -0.90, -0.55, -0.90, 0.55]
      max_linear_speed: 0.75
      max_angular_speed: 0.5

  # --- Speed and acceleration (config/navigation.yaml, config/collision_monitor.yaml) ---
  controller_server:
    ros__parameters:
      FollowPath:
        desired_linear_vel: 0.75
        rotate_to_heading_angular_vel: 0.5
  # Keep velocity_smoother and adaptive_surround within cmd_vel_safety's speed caps.
  velocity_smoother:
    ros__parameters:
      max_velocity: [0.75, 0.0, 0.5]
      min_velocity: [-0.75, 0.0, -0.5]
      max_accel: [0.8, 0.0, 1.5]
      max_decel: [-1.5, 0.0, -2.0]
  cmd_vel_safety:
    ros__parameters:
      max_linear_accel: 0.8
      max_angular_accel: 1.5
      max_linear_speed: 0.75
      max_angular_speed: 0.5
