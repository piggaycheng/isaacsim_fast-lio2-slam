# Robot-type profile: Deep Robotics M20 (wheel-legged quadruped).
# Uses 3D LIO + IMU local odometry (no differential-drive wheel encoder odometry)
# and locomotion policy + elevation_mapping_cupy for control.
simulation:
  asset: /Isaac/Robots/DeepRobotics/M20/M20.usd
  articulation: base_link
  lidar: base_link/lidar
  lidar_translation: [0.2, 0.0, 0.15]
  imu: base_link/lidar/fastlio_imu
  wheel_joints: [fl_wheel_joint, fr_wheel_joint]
  wheel_radius: 0.10
  wheel_base: 0.506
  forward_sign: 1.0
  spawn_height: 0.49

# base_link -> LiDAR / co-located FAST-LIO body (m, rad).
sensor_frames:
  lidar_link: {x: 0.2, y: 0.0, z: 0.15, roll: 0.0, pitch: 0.0, yaw: 0.0}
  imu_link: {x: 0.2, y: 0.0, z: 0.15, roll: 0.0, pitch: 0.0, yaw: 0.0}

# 3D odom -> base_link from gravity-aligned LIO + IMU (required for elevation mapping).
local_odometry:
  inputs: [lio, imu]
  three_d: true

parameter_overrides:
  nav_imu_adapter:
    ros__parameters:
      orientation_variance: 0.01
      angular_velocity_variance: 0.005
      linear_acceleration_variance: 0.04
  lio_odometry:
    ros__parameters:
      position_variance: 1.0e-05
      yaw_variance: 1.0e-05
  global_pose_adapter:
    ros__parameters:
      registration_covariance_scale: 1.0
      min_covariance_xy: 0.0002
      min_covariance_yaw: 2.0e-06

  # USD visible + collision bounds in base_link rounded outward to 1 mm.
  global_costmap:
    global_costmap:
      ros__parameters:
        footprint: '[[0.409, 0.254], [0.409, -0.252], [-0.409, -0.252], [-0.409, 0.254]]'
        footprint_padding: 0.01
        inflation_layer: {inflation_radius: 1.1}
  local_costmap:
    local_costmap:
      ros__parameters:
        footprint: '[[0.409, 0.254], [0.409, -0.252], [-0.409, -0.252], [-0.409, 0.254]]'
        footprint_padding: 0.01
        inflation_layer: {inflation_radius: 0.9}
  ground_obstacle_filter:
    ros__parameters:
      self_filter_bounds: [-0.409, 0.409, -0.252, 0.254]
      # Standing height in base_link (ground is ~0.49 m below base_link).
      ground_z: -0.49
      ground_search_height: 0.35

  controller_server:
    ros__parameters:
      FollowPath:
        desired_linear_vel: 0.6
        rotate_to_heading_angular_vel: 0.5
        use_rotate_to_heading: false
  velocity_smoother:
    ros__parameters:
      max_velocity: [0.6, 0.0, 0.5]
      min_velocity: [-0.5, 0.0, -0.5]
      max_accel: [0.8, 0.0, 1.5]
      max_decel: [-1.5, 0.0, -2.0]
  cmd_vel_safety:
    ros__parameters:
      max_linear_accel: 0.8
      max_angular_accel: 1.5
      max_linear_speed: 0.6
      max_angular_speed: 0.5
