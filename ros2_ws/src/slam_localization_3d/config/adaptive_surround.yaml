# Experimental Carter crawl profile; other collision-monitor zones remain unchanged.
adaptive_surround:
  ros__parameters:
    # Retain room for the existing 1 s sensor watchdog and rotational sweep.
    crawl_points: [0.90, 0.55, 0.90, -0.55, -0.45, -0.55, -0.45, 0.55]
    crawl_linear: 0.10
    crawl_angular: 0.20
    motion_margin: 0.02
    shrink_hold: 0.5
    odom_timeout: 0.3
    command_timeout: 0.3
    switch_timeout: 1.0
