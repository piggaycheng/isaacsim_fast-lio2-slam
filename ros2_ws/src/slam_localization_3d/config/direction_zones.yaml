# Zones are generated at launch from both costmaps' matching padded body rectangles.
# Forward/reverse extend only along the travel direction; rotate covers the corner
# sweep about base_link. PolygonSlow encloses the union and is always enabled.
direction_zones:
  ros__parameters:
    # Design estimates, not certified braking measurements. At 0.75 m/s these
    # produce 0.56 m stop extension. Slow expansion is a separate fixed distance.
    reaction_time: 0.3
    effective_deceleration: 1.0
    distance_margin: 0.05
    slow_padding: 0.10
    # Commands below these magnitudes do not request a zone change.
    linear_deadband: 0.01
    angular_deadband: 0.02
    # Zones switch only after a zero command and measured standstill.
    standstill_linear: 0.03
    standstill_angular: 0.05
    settle_time: 0.2
    odom_timeout: 0.3
    command_timeout: 0.3
    switch_timeout: 1.0
