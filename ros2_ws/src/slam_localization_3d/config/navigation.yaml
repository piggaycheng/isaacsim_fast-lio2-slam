planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.1
      use_astar: false
      allow_unknown: false

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    speed_limit_topic: /speed_limit
    failure_tolerance: 1.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: "slam_nav::LatchedGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
      # Keep the reached-position latch across 1 Hz replanning unless Carter drifts this far.
      latch_release_distance: 0.5
    FollowPath:
      plugin: "slam_nav::GoalHeadingLatchedRPP"
      desired_linear_vel: 0.5
      lookahead_dist: 0.8
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.04
      approach_velocity_scaling_dist: 0.5
      rotate_to_heading_angular_vel: 0.35
      use_rotate_to_heading: true
      # Keep rotating in place after reaching the goal unless Carter drifts this far away.
      latch_release_distance: 0.5
      allow_reversing: false
      use_collision_detection: true
      transform_tolerance: 0.5

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    # CLOSED_LOOP stalls Carter: one accel step above measured zero cannot
    # overcome wheel friction during in-place rotation.
    feedback: "OPEN_LOOP"
    # Keep within cmd_vel_safety's max_linear/angular_speed (collision_monitor.yaml).
    max_velocity: [0.75, 0.0, 0.7]
    min_velocity: [-0.75, 0.0, -0.7]
    max_accel: [0.8, 0.0, 1.5]
    max_decel: [-1.5, 0.0, -2.0]
    deadband_velocity: [0.0, 0.0, 0.0]
    # Decelerate to zero if Nav2 stops publishing for this long.
    velocity_timeout: 0.5

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/local
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node

behavior_server:
  ros__parameters:
    use_sim_time: true
    # BackUp checks its simulated motion against the local costmap footprint.
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "wait"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
