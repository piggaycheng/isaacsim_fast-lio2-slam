global_ekf:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.2
    reset_on_time_jump: true
    two_d_mode: true
    # PCD poses carry the (older) LIO stamp they were composed with; rewind and
    # replay so they are fused at that time instead of the current state.
    smooth_lagged_data: true
    history_length: 1.0
    publish_tf: false
    publish_acceleration: false
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    odom0: /wheel/odom
    odom0_config:
      [false, false, false,
       false, false, false,
       true, false, false,
       false, false, true,
       false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true

    imu0: /nav/imu
    imu0_config:
      [false, false, false,
       false, false, false,
       false, false, false,
       false, false, true,
       false, false, false]
    imu0_queue_size: 20
    imu0_nodelay: true

    pose0: /localization_3d/global_pose
    pose0_config:
      [true, true, false,
       false, false, true,
       false, false, false,
       false, false, false,
       false, false, false]
    pose0_queue_size: 10
    pose0_nodelay: true

global_pose_adapter:
  ros__parameters:
    # Published x/y/yaw covariance = scale * (propagated ICP covariance + minimums).
    # registration_covariance_scale and min_covariance_xy/yaw are vehicle-specific and
    # live only in the robot profile (config/robots/<type>.yaml); calibrate them with
    # scripts/covariance_calibration.py (docs/covariance_calibration.md).
    # Fallback only when a correction carries no ICP covariance.
    covariance_xy: 0.25
    covariance_yaw: 0.09

# Global-EKF side of slam_localization_3d lio_odometry (lio/twist). Used only
# when the local_ekf inputs have no wheel odometry: global_ekf then propagates
# with the scan-to-scan LIO velocity instead of /wheel/odom. These variances are
# separate from the local lio/odom pose variances (position_variance,
# yaw_variance in the robot profile) so covariance calibration of the local EKF
# leaves the global EKF unchanged. Tuned, not calibrated: 2e-5 equals what
# robot_localization derived from the former differential lio/odom input
# (2 x 1e-4 pose variance x 0.1 s scan interval).
lio_odometry:
  ros__parameters:
    twist_linear_variance: 2.0e-5
    twist_angular_variance: 2.0e-5
