wheel_encoder_odometry:
  ros__parameters:
    use_sim_time: true
    joint_topic: /isaac/joint_states
    odom_topic: /wheel/odom
    left_joint: joint_wheel_right
    right_joint: joint_wheel_left
    odom_frame: odom
    base_frame: base_link
    wheel_radius: 0.14
    wheel_base: 0.4132
    encoder_ticks_per_revolution: 2048
    left_distance_scale: 1.002
    right_distance_scale: 0.998
    left_direction: -1.0
    right_direction: -1.0
    distance_noise_ratio: 0.005
    random_seed: 42

nav_imu_adapter:
  ros__parameters:
    use_sim_time: true
    input_topic: /isaac/imu
    output_topic: /nav/imu
    orientation_variance: 0.01
    angular_velocity_variance: 0.0025
    linear_acceleration_variance: 0.04

pointcloud_to_laserscan:
  ros__parameters:
    use_sim_time: true
    target_frame: base_link
    transform_tolerance: 0.05
    min_height: 0.1
    max_height: 2.0
    angle_min: -3.141592654
    angle_max: 3.141592654
    angle_increment: 0.008726646
    scan_time: 0.1
    range_min: 0.5
    range_max: 30.0
    use_inf: true
    inf_epsilon: 1.0
    concurrency_level: 1

local_ekf:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /wheel/odom
    odom0_config:
      [false, false, false,
       false, false, true,
       true,  false, false,
       false, false, false,
       false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10
    odom0_nodelay: true

    imu0: /nav/imu
    imu0_config:
      [false, false, false,
       false, false, false,
       false, false, false,
       false, false, true,
       false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 20
    imu0_nodelay: true
