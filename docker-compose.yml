name: isaacsim-fastlio2

services:
  ros:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
    image: isaacsim-fastlio2-ros:humble
    entrypoint: ["/workspace/docker/entrypoint.sh"]
    command: ["${ROS_COMMAND:-idle}"]
    init: true
    stop_signal: SIGINT
    stop_grace_period: 20s
    # DDS uses host-network UDP; shared-memory port locks can stall after restarts.
    network_mode: host
    ipc: host
    gpus: all
    working_dir: /workspace
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-10}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      FASTRTPS_DEFAULT_PROFILES_FILE: /workspace/docker/fastdds_udp.xml
      ROS_LAUNCH_ARGS: ${ROS_LAUNCH_ARGS:-}
      DISPLAY: ${DISPLAY:-}
      XAUTHORITY: /tmp/.Xauthority
      QT_X11_NO_MITSHM: "1"
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/dev/null}:/tmp/.Xauthority:ro

  height_map:
    profiles: ["height_map"]
    build:
      context: .
      dockerfile: docker/Dockerfile.height_map
      args:
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
    image: isaacsim-fastlio2-height-map:humble
    entrypoint: ["/workspace/docker/entrypoint.sh"]
    command: ["${HEIGHT_MAP_COMMAND:-idle}"]
    init: true
    stop_signal: SIGINT
    stop_grace_period: 20s
    network_mode: host
    ipc: host
    gpus: all
    working_dir: /workspace
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-10}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      FASTRTPS_DEFAULT_PROFILES_FILE: /workspace/docker/fastdds_udp.xml
      ROS_LAUNCH_ARGS: ${HEIGHT_MAP_LAUNCH_ARGS:-}
      ELEVATION_CONFIG: ${ELEVATION_CONFIG:-/workspace/ros2_ws/src/slam_localization_3d/config/elevation_m20_nav.yaml}
      DISPLAY: ${DISPLAY:-}
      XAUTHORITY: /tmp/.Xauthority
      QT_X11_NO_MITSHM: "1"
      NVIDIA_DRIVER_CAPABILITIES: all
    volumes:
      - .:/workspace
      - ${POLICY_DIR:-/tmp}:/policies:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/dev/null}:/tmp/.Xauthority:ro
