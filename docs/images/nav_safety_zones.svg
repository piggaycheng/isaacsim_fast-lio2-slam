<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="830" viewBox="0 0 1320 830" font-size="16" fill="#0f172a" role="img" aria-labelledby="title description">
  <title id="title">Nova Carter body, footprint and direction-switched collision monitor zones</title>
  <desc id="description">Three equal-scale top views in base_link, forward x to the right and left y up, one per direction zone set. Forward enables the stop, slowdown and forward-trimmed surround zones; reverse enables the reverse-trimmed surround; rotate enables a circle whose radius equals the global costmap robot_radius, shown with Nav2's 16-gon approximation and the padded footprint rotation sweep.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: sans-serif; }
      .small { font-size: 14px; fill: #475569; }
      .heading { font-size: 18px; font-weight: bold; }
    </style>
  </defs>
  <rect width="1320" height="830" fill="white"/>
  <text x="40" y="40" font-size="26" font-weight="bold">Nova Carter navigation geometry: top view in base_link</text>
  <text x="40" y="68" class="small">165 px/m, equal x/y scale; white dot is base_link. direction_zones.py enables one zone set at a time after standstill.</text>
  <rect x="40" y="95" width="400" height="420" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="54.0" y="122.0" class="heading" >forward: linear.x &gt; 0</text>
  <rect x="126.3" y="206.2" width="265.7" height="247.5" fill="#fae8ff" stroke="#a21caf" stroke-width="2.5" fill-opacity="0.5"/>
  <rect x="293.0" y="247.5" width="123.8" height="165.0" fill="#ffedd5" stroke="#c2410c" stroke-width="2.5" fill-opacity="0.8"/>
  <rect x="293.0" y="270.6" width="107.2" height="118.8" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5" fill-opacity="0.8"/>
  <rect x="151.1" y="275.6" width="143.6" height="108.9" fill="#dcfce7" stroke="#15803d" stroke-width="2" stroke-dasharray="5 3"/>
  <rect x="152.8" y="277.2" width="140.3" height="105.6" fill="#fde047" stroke="#a16207" stroke-width="2" />
  <rect x="163.0" y="288.8" width="120.1" height="82.3" fill="#cbd5e1" stroke="#334155" stroke-width="2" />
  <circle cx="260.0" cy="330" r="4" fill="white" stroke="#0f172a" stroke-width="2"/>
  <text x="54.0" y="480.0" class="small" fill="#a21caf">SurroundForward x [-0.81, 0.80]</text>
  <text x="54.0" y="500.0" class="small" fill="#dc2626">Stop x [0.20, 0.85], y ±0.36</text>
  <text x="54.0" y="520.0" class="small" fill="#c2410c">Slow 50% x [0.20, 0.95], y ±0.50</text>
  <line x1="48" y1="330" x2="432" y2="330" stroke="#94a3b8" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <text x="428.0" y="350.0" class="small" text-anchor="end">+x</text>
  <rect x="460" y="95" width="400" height="420" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="474.0" y="122.0" class="heading" >reverse: linear.x &lt; 0</text>
  <rect x="507.2" y="206.2" width="282.1" height="247.5" fill="#fae8ff" stroke="#a21caf" stroke-width="2.5" fill-opacity="0.5"/>
  <rect x="621.1" y="275.6" width="143.6" height="108.9" fill="#dcfce7" stroke="#15803d" stroke-width="2" stroke-dasharray="5 3"/>
  <rect x="622.8" y="277.2" width="140.3" height="105.6" fill="#fde047" stroke="#a16207" stroke-width="2" />
  <rect x="633.0" y="288.8" width="120.1" height="82.3" fill="#cbd5e1" stroke="#334155" stroke-width="2" />
  <circle cx="730.0" cy="330" r="4" fill="white" stroke="#0f172a" stroke-width="2"/>
  <text x="474.0" y="480.0" class="small" fill="#a21caf">SurroundReverse x [-1.35, 0.36], y ±0.75</text>
  <text x="474.0" y="500.0" class="small" >Trimmed side keeps swing_margin 0.15 m</text>
  <text x="474.0" y="520.0" class="small" >beyond the padded footprint</text>
  <line x1="468" y1="330" x2="852" y2="330" stroke="#94a3b8" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <text x="848.0" y="350.0" class="small" text-anchor="end">+x</text>
  <rect x="880" y="95" width="400" height="420" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="894.0" y="122.0" class="heading" >rotate: in place</text>
  <circle cx="1080.0" cy="330" r="133.7" fill="#ede9fe" fill-opacity="0.7" stroke="#6d28d9" stroke-width="2.5"/>
  <polygon points="1213.7,330.0 1203.5,278.9 1174.5,235.5 1131.1,206.5 1080.0,196.3 1028.9,206.5 985.5,235.5 956.5,278.9 946.4,330.0 956.5,381.1 985.5,424.5 1028.9,453.5 1080.0,463.6 1131.1,453.5 1174.5,424.5 1203.5,381.1" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="1080.0" cy="330" r="121.8" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="2 4"/>
  <rect x="971.1" y="275.6" width="143.6" height="108.9" fill="#dcfce7" stroke="#15803d" stroke-width="2" stroke-dasharray="5 3"/>
  <rect x="972.8" y="277.2" width="140.3" height="105.6" fill="#fde047" stroke="#a16207" stroke-width="2" />
  <rect x="983.0" y="288.8" width="120.1" height="82.3" fill="#cbd5e1" stroke="#334155" stroke-width="2" />
  <circle cx="1080.0" cy="330" r="4" fill="white" stroke="#0f172a" stroke-width="2"/>
  <text x="894.0" y="480.0" class="small" fill="#6d28d9">PolygonRotate = global robot_radius: 0.81 m</text>
  <text x="894.0" y="500.0" class="small" fill="#0f766e">Nav2 16-gon, inscribed 0.794 m</text>
  <text x="894.0" y="520.0" class="small" >Padded footprint sweep 0.738 m (+ one 0.05 m cell)</text>
  <line x1="888" y1="330" x2="1272" y2="330" stroke="#94a3b8" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
  <text x="1268.0" y="350.0" class="small" text-anchor="end">+x</text>
  <rect x="45" y="557" width="20" height="14" fill="#cbd5e1" stroke="#334155" />
  <text x="78" y="570">Body envelope (USD): x [-0.588, 0.140], y ±0.249 m</text>
  <rect x="45" y="587" width="20" height="14" fill="#fde047" stroke="#a16207" />
  <text x="78" y="600">Local footprint: x [-0.65, 0.20], y ±0.32 m</text>
  <rect x="45" y="617" width="20" height="14" fill="#dcfce7" stroke="#15803d" stroke-dasharray="3 2"/>
  <text x="78" y="630">+ padding 10 mm: x [-0.66, 0.21], y ±0.33 m</text>
  <line x1="45" y1="654" x2="65" y2="654" stroke="#475569" stroke-width="2" stroke-dasharray="2 4"/>
  <text x="78" y="660">Padded footprint rotation sweep: 0.738 m</text>
  <line x1="45" y1="684" x2="65" y2="684" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="78" y="690">Nav2 16-gon of robot_radius: inscribed 0.794 m</text>
  <rect x="600" y="557" width="20" height="14" fill="#fae8ff" stroke="#a21caf" />
  <text x="633" y="570">SurroundForward / SurroundReverse: STOP</text>
  <rect x="600" y="587" width="20" height="14" fill="#fee2e2" stroke="#dc2626" />
  <text x="633" y="600">PolygonStop (front): STOP</text>
  <rect x="600" y="617" width="20" height="14" fill="#ffedd5" stroke="#c2410c" />
  <text x="633" y="630">PolygonSlow (front): slow to 50%</text>
  <rect x="600" y="647" width="20" height="14" fill="#ede9fe" stroke="#6d28d9" />
  <text x="633" y="660">PolygonRotate: STOP, radius = global robot_radius 0.81 m</text>
  <text x="40" y="735" class="small">Panels show the default direction-zone mode. The global costmap plans with the same 0.81 m rotation circle (footprint '[]', no padding), so planned poses leave room to rotate.</text>
  <text x="40" y="759" class="small">PolygonSurround x [-1.35, 0.80], y ±0.75 m is only the template for Forward/Reverse here; it is active in every direction with --static-zones, and with --adaptive-surround</text>
  <text x="40" y="783" class="small">(which also adds the smaller Crawl zone). FootprintApproach (always on) projects the local footprint along the command for a 1.5 s time-to-collision check.</text>
  <text x="40" y="807" class="small">Zones overlap and are independent settings. Inflation is a cost gradient around obstacles, not a robot-centered polygon.</text>
</svg>
